# Modified From https://github.com/kingbri1/flash-attention/blob/main/.github/workflows/build-wheels.yml

name: Build flash-attention Wheels

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag of flash-attention to build: (format: v2.3.4/v2.3.4.post1)'
        default: 'v2.8.3'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_sdist:
    name: Build and Upload Source Code Distibution
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Build sdist
        env:
          FLASH_ATTENTION_SKIP_CUDA_BUILD: "TRUE"
        run: |
          wget "https://raw.githubusercontent.com/XXXXRT666/flash-attention/main/pyproject.toml"

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("setup.py")
          content = path.read_text()
          content, count = re.subn(
              r'BASE_WHEEL_URL\s*=\s*\(\s*"[^"]+"\s*\)',
              'BASE_WHEEL_URL = (\n'
              '    "https://github.com/XXXXRT666/flash-attention/releases/download/{tag_name}/{wheel_name}"\n'
              ')',
              content,
          )
          if count != 1:
              raise RuntimeError(f"Expected to update exactly one BASE_WHEEL_URL, updated {count}")
          path.write_text(content)
          PY

          pip install ninja packaging wheel build
          pip install setuptools==75.8.0
          pip install torch --index-url https://download.pytorch.org/whl/cpu

          python setup.py sdist --dist-dir=dist

      - name: Upload files to a GitHub release
        uses: svenstaro/upload-release-action@2.6.1
        continue-on-error: true
        with:
          file: ./dist/*
          tag: ${{ inputs.version }}
          file_glob: true
          overwrite: true
          release_name: ${{ inputs.version }}

  build_wheels:
    name: Build wheels for OS ${{ matrix.os }}, Python ${{ matrix.pyver }}, CUDA ${{ matrix.torch_cuda.cuda }}, and Torch ${{ matrix.torch_cuda.torchver }}+cu${{ matrix.torch_cuda.pytorch_cuda }} with CXX11_ABI ${{ matrix.cxx11_abi }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-2022", "ubuntu-22.04", "ubuntu-22.04-arm"]
        pyver: ["3.10", "3.11", "3.12"]
        torch_cuda:
          - torchver: "2.8.0"
            cuda: "12.9.1"
            pytorch_cuda: "129"
          - torchver: "2.9.1"
            cuda: "12.9.1"
            pytorch_cuda: "128"
          - torchver: "2.9.1"
            cuda: "13.2.0"
            pytorch_cuda: "130"
          - torchver: "2.10.0"
            cuda: "12.9.1"
            pytorch_cuda: "128"
          - torchver: "2.10.0"
            cuda: "13.2.0"
            pytorch_cuda: "130"
          - torchver: "2.11.0"
            cuda: "12.9.1"
            pytorch_cuda: "128"
          - torchver: "2.11.0"
            cuda: "13.2.0"
            pytorch_cuda: "130"
          - torchver: "2.12.0"
            cuda: "12.9.1"
            pytorch_cuda: "126"
          - torchver: "2.12.0"
            cuda: "13.2.0"
            pytorch_cuda: "132"
        cxx11_abi: ['FALSE', 'TRUE']
        exclude:
          - os: windows-2022
            cxx11_abi: 'FALSE'
    defaults:
      run:
        shell: pwsh
    env:
        CUDAVER: ${{ matrix.torch_cuda.cuda }}
        PCKGVER: ${{ inputs.version }}

    steps:
      - name: Allow long paths
        run: git config --system core.longpaths true
        if: runner.os == 'Windows'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.version }}

      - name: Install VS2022 BuildTools 17.9.7
        run: choco install -y visualstudio2022buildtools --version=117.9.7.0 --params "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --installChannelUri https://aka.ms/vs/17/release/180911598_-255012421/channel"
        if: runner.os == 'Windows'

      - name: Install Windows CUDA ${{ matrix.torch_cuda.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit-win
        with:
          cuda: "${{ matrix.torch_cuda.cuda }}"
          method: "network"
        if: runner.os == 'Windows'

      - name: Install Linux CUDA ${{ matrix.torch_cuda.cuda }}
        uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit-Linux
        with:
          cuda: "${{ matrix.torch_cuda.cuda }}"
          linux-local-args: '["--toolkit"]'
          method: "network"
          sub-packages: '["nvcc"]'
        if: runner.os != 'Windows'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.pyver }}

      - name: Install Dependencies
        run: |
          git config --system core.longpaths true

          $torchCudaVer = "${{ matrix.torch_cuda.pytorch_cuda }}"

          Write-Host "https://download.pytorch.org/whl/cu$torchCudaVer"

          python -m ensurepip
          pip install --no-cache-dir --upgrade build setuptools wheel packaging ninja psutil
          pip install --no-cache-dir  "torch==${{ matrix.torch_cuda.torchver }}" --index-url "https://download.pytorch.org/whl/cu$torchCudaVer"

      - name: Build Wheel
        id: build-wheel
        run: |
          # --- Spawn the VS shell

          $setupPath = "setup.py"
          $content = Get-Content $setupPath -Raw

          $code = @'
            import re
            from pathlib import Path
            from packaging.version import parse
            v = re.search(r"__version__ *= *[\"']([^\"']+)", Path("__init__.py").read_text()).group(1)
            exit(0) if parse(v) <= parse("2.8.1") else exit(1)
          '@

          if ($IsWindows) {
            Import-Module 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\Tools\Microsoft.VisualStudio.DevShell.dll'
            Enter-VsDevShell -VsInstallPath 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools' -DevCmdArguments '-arch=x64 -host_arch=x64'
            $env:DISTUTILS_USE_SDK=1

            python -c $code

            if ($LASTEXITCODE -eq 0) {
                $content = $content -replace '("--use_fast_math",)',
                                            '"--use_fast_math", "-Xcompiler", "/Zc:__cplusplus", "-Xcompiler", "/Zc:preprocessor", '

                $content = $content -replace '"cxx":\s*\[\s*"-O3",\s*"-std=c\+\+17"\s*\]',
                                            '"cxx": ["-O2", "/std:c++17", "/Zc:__cplusplus", "/Zc:preprocessor", "/nologo"]'
            } else {
                $content = $content -replace 'compiler_c17_flag\s*=\s*\[\s*"-O2",\s*"/std:c\+\+17",\s*"/Zc:__cplusplus"\s*\]',
                                            'compiler_c17_flag=["-O2", "/std:c++17", "/Zc:__cplusplus", "/Zc:preprocessor", "/nologo"]'
            }

            $content = $content -replace '("--use_fast_math",)',
                                    '"--use_fast_math", "-Xcudafe", "--diag_suppress=221", "-Xcudafe", "--diag_suppress=177","-Xcudafe", "--diag_suppress=550", "-Xcompiler", "/nologo", "-Xcompiler", "/Zc:preprocessor", '

            $content = $content -replace '("build_ext"\s*:\s*)NinjaBuildExtension\b',
                                    '${1}NinjaBuildExtension.with_options(use_ninja=True)'
          }

          $injection = @"
          from torch.utils import cpp_extension
          cpp_extension.COMMON_NVCC_FLAGS.clear()
          "@

          $content = $content -replace '(?m)^from wheel\.bdist_wheel import bdist_wheel as _bdist_wheel\s*$',
                                     "from wheel.bdist_wheel import bdist_wheel as _bdist_wheel`n$injection"

          $macros = @(
              '-DFLASHATTENTION_DISABLE_BACKWARD',
              '-DFLASHATTENTION_DISABLE_DROPOUT',
              '-DFLASHATTENTION_DISABLE_UNEVEN_K',
              '-DFLASHATTENTION_DISABLE_LOCAL',
              '-DFLASHATTENTION_DISABLE_ALIBI'
          )

          $lines = $content -split "`n"

          foreach ($macro in $macros) {
              for ($i = 0; $i -lt $lines.Length; $i++) {
                  if ($lines[$i] -match "[`"']$macro[`"']" -and $lines[$i] -match '^\s*#') {
                      $lines[$i] = ($lines[$i] -replace '^(\s*)#\s*', '$1')
                      break
                  }
              }
          }

          $content = $lines -join "`n"

          Set-Content $setupPath $content -Encoding UTF8

          $cudaVersion = $env:CUDAVER.Split('.')[0]
          $packageVersion = $env:PCKGVER.TrimStart('v')

          $env:CUDA_PATH = $env:CONDA_PREFIX
          $env:CUDA_HOME = $env:CONDA_PREFIX

          $torchver = '${{ matrix.torch_cuda.torchver }}'.Split('.')[0,1] -join '.'

          $env:MAX_JOBS = '1'
          $env:FLASH_ATTENTION_FORCE_BUILD = 'TRUE'
          $env:FLASH_ATTENTION_FORCE_CXX11_ABI = '${{ matrix.cxx11_abi }}'
          $env:BUILD_TARGET = "cuda"
          $env:NVCC_THREADS = '2'

          python -c "import torch.utils.cpp_extension;torch.utils.cpp_extension.is_ninja_available();torch.utils.cpp_extension.verify_ninja_availability()"

          python setup.py bdist_wheel --dist-dir=dist

          $wheel = (gi '.\dist\*.whl')[0]
          $wheelname = $wheel.name.replace("flash_attn-$packageVersion-","flash_attn-$packageVersion+cu$cudaVersion"+"torch$torchver"+"cxx11abi${{ matrix.cxx11_abi }}-")
          Move-Item $wheel.fullname ".\dist\$wheelname"

      - name: Log Built Wheels
        run: |
          ls dist

      - name: Upload files to a GitHub release
        uses: svenstaro/upload-release-action@2.6.1
        continue-on-error: true
        with:
          file: ./dist/*.whl
          tag: ${{ inputs.version }}
          file_glob: true
          overwrite: true
          release_name: ${{ inputs.version }}
